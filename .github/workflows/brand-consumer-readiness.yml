name: Validate brand consumer readiness
on:
  push:
    paths: ['brand_consumer_readiness/**', 'campaign_experiments/results/assigned_arm_metrics.csv', '.github/workflows/brand-consumer-readiness.yml']
  pull_request:
    paths: ['brand_consumer_readiness/**', 'campaign_experiments/results/assigned_arm_metrics.csv']
  workflow_dispatch:
jobs:
  readiness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brand_consumer_readiness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python pipeline.py
      - run: python -m unittest -v
