name: Validate campaign experiments
on:
  push:
    paths: ['campaign_experiments/**', '.github/workflows/campaign_experiments.yml']
  pull_request:
    paths: ['campaign_experiments/**', '.github/workflows/campaign_experiments.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campaign_experiments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
      - run: python pipeline.py
